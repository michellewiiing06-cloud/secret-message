<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Message</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    font-family: Georgia, "Times New Roman", serif;
    background: radial-gradient(circle at top, #3b102d 0%, #160817 45%, #08040d 100%);
    color: #fff5fb;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .screen {
    width: min(900px, 92vw);
    min-height: 90vh;
    padding: 34px 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .card {
    width: min(760px, 100%);
    padding: 34px 28px;
    border: 1px solid rgba(255, 190, 225, .35);
    border-radius: 28px;
    background: rgba(20, 7, 23, .78);
    box-shadow: 0 0 45px rgba(255, 74, 166, .22);
    backdrop-filter: blur(10px);
    text-align: center;
  }
  h1 { margin: 0 0 10px; font-size: clamp(30px, 6vw, 54px); }
  .sub { opacity: .82; margin-bottom: 28px; }
  input {
    width: min(300px, 90%);
    padding: 14px 18px;
    border: 1px solid #ff9ed0;
    border-radius: 999px;
    background: #140914;
    color: white;
    text-align: center;
    font-size: 20px;
    outline: none;
  }
  button {
    display: block;
    margin: 16px auto 0;
    padding: 13px 28px;
    border: 0;
    border-radius: 999px;
    background: #ff5eaa;
    color: white;
    font-size: 17px;
    cursor: pointer;
    box-shadow: 0 7px 25px rgba(255, 94, 170, .25);
  }
  button:hover { transform: translateY(-1px); }
  #wrong { min-height: 24px; margin-top: 13px; color: #ffb4d9; }
  #message { display: none; }
  .typing {
    white-space: pre-line;
    line-height: 1.75;
    font-size: clamp(17px, 2.4vw, 21px);
    margin: 25px auto;
    max-width: 680px;
    min-height: 360px;
  }
  .character {
    font-family: monospace;
    font-size: clamp(22px, 4vw, 34px);
    line-height: 1.05;
    margin: 20px 0;
  }
  .hearts { font-size: 24px; letter-spacing: 7px; margin: 14px 0; }
  .balloon {
    position: fixed;
    bottom: -100px;
    font-size: 46px;
    animation: floatUp linear forwards;
    pointer-events: none;
    z-index: 5;
  }
  @keyframes floatUp {
    from { transform: translateY(0) rotate(-5deg); opacity: 0; }
    10% { opacity: 1; }
    to { transform: translateY(-120vh) rotate(12deg); opacity: 0; }
  }
  .pulse { animation: pulse 1.1s ease-in-out infinite alternate; }
  @keyframes pulse { to { text-shadow: 0 0 25px #ff69b4; transform: scale(1.03); } }
  .footer { opacity: .65; margin-top: 25px; font-size: 14px; }
</style>
</head>
<body>

<div class="screen">
  <div class="card">

    <section id="lock">
      <div class="hearts">♥ ♥ ♥ ♥ ♥</div>
      <h1>Secret Message</h1>
      <div class="sub">There is a little surprise waiting for you...</div>
      <input id="code" type="password" inputmode="numeric" maxlength="3" placeholder="Enter the code">
      <button onclick="unlock()">Unlock ♡</button>
      <div id="wrong"></div>
    </section>

    <section id="message">
      <div class="hearts pulse">♥ ♥ ♥ ♥ ♥ ♥ ♥</div>
      <h1>YOU UNLOCKED IT! ♡</h1>

      <div class="character">
          /\_/\\<br>
         ( o.o )<br>
          &gt; ^ &lt;<br>
         /| ♥ |\
      </div>

      <div id="typing" class="typing"></div>

      <div class="hearts">♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥ ♥</div>
      <div class="footer">Made with 3 hours of effort, just for you. ♡</div>
    </section>

  </div>
</div>

<script>
const message = `Hey you. ❤️

Okay, first of all... if you're reading this, congratulations.

You somehow managed to make me spend approximately THREE HOURS making a whole program just to tell you something I could've probably said in five minutes. 😭

But honestly? I wouldn't change a thing.

I know this is technically just a program, some code, some words on a screen, and probably a bunch of things that made me stare at my computer wondering why I decided to do this to myself. 💀

But to me, it's a little more than that.

I made this because I wanted to give you something that wasn't just a normal message. I wanted to make something that actually took time. Something I could look at later and remember:

"Yeah, I made that for them because I really, really cared."

And I do.

A lot.

Sometimes I genuinely don't know how to explain what you mean to me without sounding ridiculously cheesy, but I'm going to try anyway because you deserve to hear it.

You make me happy in ways you probably don't even realize. Sometimes it's something tiny you say. Sometimes it's just seeing your name pop up. Sometimes it's talking to you about absolutely nothing and somehow still enjoying every second of it.

And I love that.

I love the little things about us. The stupid conversations. The random jokes. The moments where neither of us knows what we're even talking about anymore. The teasing. The chaos. The "bro" moments. The times we annoy each other and then come back like nothing happened. 😭

I love having someone I can share things with.

Someone I can think about randomly during the day.

Someone who can make an ordinary day feel a little less ordinary.

I don't expect everything to be perfect all the time. We're both human. We'll have weird days, misunderstandings, annoying moments, arguments, and times when one of us is being an absolute idiot. Probably me. 💀

But I don't want perfection.

I want something real.

I want the kind of friendship where we can laugh until our stomachs hurt, talk about serious things when we need to, annoy each other for no reason, support each other when things get hard, and still be there afterward.

I want to keep making memories with you.

More inside jokes.
More random conversations.
More "remember when..." moments.
More days where we look back and realize how much we've experienced together.

And honestly, I hope this little program becomes one of those memories.

Because someday, I want you to remember that there was a ridiculously determined person sitting there for THREE HOURS writing code just because they wanted to make you smile. 😭

I could've just typed "thank you."

But where's the fun in that?

You deserve the unnecessarily long version. 😭❤️

So here it is:

You matter to me.

I love having you in my life.
I love the way you can make me smile without even trying.
I love all the tiny moments that probably don't seem important but somehow become my favorite memories.
And I love that this is OUR little thing.

I don't need some giant movie scene or some impossible fairytale.

Sometimes I just want us being stupid together.
Us laughing at things that aren't even funny.
Us sending random messages.
Us being there for each other.
Us making memories that we'll laugh about years later.

That's enough for me.

And if you ever wonder whether you're important to me, please remember this.

I spent.
THREE.
WHOLE.
HOURS.
ON.
THIS.
THING.

THREE HOURS. 😭😭😭

Do you understand how insane that is???

I could've watched a movie.
I could've slept.
I could've done literally anything else.

But I was sitting there like:

"Hmm yes, today I shall create an entire emotional software application for my best friend." 💀

And somehow, I enjoyed doing it.

Because it was for you.

That's the part that matters.

Every little bit of effort I put into this was basically my ridiculously complicated way of saying:

"You matter to me."

So thank you.

Thank you for being you.
Thank you for being part of my life.
Thank you for all the laughs, the conversations, the memories, and the little moments.
Thank you for giving me someone to care about this much.

I hope whenever you look at this, you don't just see a bunch of code.

I hope you see the time behind it.
The effort.
The thought.
The stupid amount of affection behind every word.

And I hope it makes you smile.

Because honestly, if this whole three-hour struggle makes you smile even once, then it was completely worth it.

So yeah...

This is me being embarrassingly sentimental for a moment.

I'm really, really glad I have you.

I'm really grateful for us.

And I'm really happy that you're the person I'm making something this stupidly elaborate for. 😭❤️

I don't know what the future is going to look like.
I don't know where we'll be, what we'll be doing, or how many ridiculous memories we'll have by then.

But right now?

I'm just happy you're here.

And I'm happy we're here.

Together.

So here's to us.

To every laugh.
Every stupid joke.
Every late conversation.
Every random message.
Every little memory.
Every annoying moment.
Every "I miss you."
Every "thank you."
Every moment we haven't even experienced yet.

And most importantly...

Here's to the fact that I somehow managed to turn "thank you" into a THREE-HOUR CODING PROJECT. 😭

You're officially responsible for my suffering. 💀

But I'd do it again.

Because you're worth the effort.
You're worth the time.
And you're worth every single line of this ridiculous little program.

You're awesome, idiot. ❤️

More than this extremely dramatic paragraph can probably explain.

And if you ever forget that...

Just open this program again.

I'll still be right here, in approximately 500 lines of unnecessary emotional code, reminding you.

You matter to me. ❤️

Always remember that.

— Your very sleep-deprived, slightly insane, but very much grateful best friend. 🫶🏻`;

function unlock() {
  const value = document.getElementById("code").value;
  const wrong = document.getElementById("wrong");

  if (value !== "143") {
    wrong.textContent = "Nope! The secret is still locked. 🔒";
    return;
  }

  document.getElementById("lock").style.display = "none";
  document.getElementById("message").style.display = "block";
  document.getElementById("typing").textContent = "";

  launchBalloons(22);
  typeMessage();
}

function typeMessage() {
  const box = document.getElementById("typing");
  let i = 0;

  function next() {
    if (i < message.length) {
      box.textContent += message[i];
      i++;
      setTimeout(next, message[i - 1] === "\n" ? 420 : 32);
    } else {
      launchBalloons(12);
    }
  }
  next();
}

function launchBalloons(count) {
  const symbols = ["🎈", "💗", "♥", "✨"];
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const b = document.createElement("div");
      b.className = "balloon";
      b.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      b.style.left = Math.random() * 95 + "vw";
      b.style.animationDuration = (5 + Math.random() * 5) + "s";
      b.style.fontSize = (30 + Math.random() * 30) + "px";
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 11000);
    }, i * 130);
  }
}

document.getElementById("code").addEventListener("keydown", e => {
  if (e.key === "Enter") unlock();
});
</script>

</body>
</html>
